<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ISKCON Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fff9ec, #fff3d4);
    font-family: 'Segoe UI', sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(212,134,10,0.15);
    text-align: center;
  }
  .om { font-size: 3rem; margin-bottom: 8px; }
  h1 { font-size: 1.3rem; color: #7a4800; margin-bottom: 4px; }
  p  { font-size: 0.85rem; color: #b07030; margin-bottom: 28px; }
  input[type=password] {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e8c87a;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    background: #fffbf2;
    color: #5a3800;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  input[type=password]:focus { border-color: #d4860a; }
  button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #d4860a, #e8a020);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .error {
    background: #fff0f0;
    color: #c0392b;
    border: 1px solid #f5c6cb;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="om">🕉️</div>
  <h1>ISKCON Bot Admin</h1>
  <p>Hare Krishna 🙏 Please enter admin password</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <input type="password" name="password" placeholder="Admin password" autofocus required>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
