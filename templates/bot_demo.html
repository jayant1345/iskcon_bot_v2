<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Guide — ISKCON Ahmedabad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        /* ── Page: warm golden cream, temple morning light ── */
        body {
            background: #fffbf2;
            background-image:
                radial-gradient(ellipse at 12% 18%, rgba(255,195,80,0.22) 0%, transparent 45%),
                radial-gradient(ellipse at 88% 82%, rgba(255,155,60,0.18) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 8%,  rgba(255,175,100,0.14) 0%, transparent 40%),
                radial-gradient(ellipse at 18% 92%, rgba(255,210,120,0.14) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(255,240,200,0.10) 0%, transparent 65%);
            color: #2d1f08;
            font-family: 'Crimson Pro', serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ── Floating lotus flowers in background ── */
        .bg-flowers {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .lotus {
            position: absolute;
            animation: flowerReveal 2.5s ease-out forwards,
                       flowerFloat  10s  ease-in-out infinite;
            opacity: 0;
        }
        .lotus svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* positions + sizes + glow colors for each lotus */
        .lotus:nth-child(1) { top:1%;   left:0%;   width:130px; filter:drop-shadow(0 0 10px rgba(248,180,200,0.7)); animation-delay:0.1s,0.1s; animation-duration:2.5s,11s; }
        .lotus:nth-child(2) { top:2%;   right:1%;  width:100px; filter:drop-shadow(0 0  8px rgba(255,200,80, 0.7)); animation-delay:0.4s,0.4s; animation-duration:2.5s, 9s; }
        .lotus:nth-child(3) { bottom:3%;left:1%;   width:115px; filter:drop-shadow(0 0 10px rgba(255,180,100,0.6)); animation-delay:0.7s,0.7s; animation-duration:2.5s,13s; }
        .lotus:nth-child(4) { bottom:2%;right:0%;  width:105px; filter:drop-shadow(0 0  9px rgba(248,160,200,0.6)); animation-delay:1.0s,1.0s; animation-duration:2.5s, 8s; }
        .lotus:nth-child(5) { top:42%;  left:-1%;  width:75px;  filter:drop-shadow(0 0  7px rgba(255,210,90, 0.5)); animation-delay:1.3s,1.3s; animation-duration:2.5s,12s; }
        .lotus:nth-child(6) { top:38%;  right:-1%; width:85px;  filter:drop-shadow(0 0  8px rgba(255,160,80, 0.5)); animation-delay:1.6s,1.6s; animation-duration:2.5s,10s; }
        .lotus:nth-child(7) { top:18%;  left:22%;  width:58px;  filter:drop-shadow(0 0  6px rgba(248,180,210,0.4)); animation-delay:1.9s,1.9s; animation-duration:2.5s,15s; }
        .lotus:nth-child(8) { bottom:22%;right:20%;width:62px;  filter:drop-shadow(0 0  6px rgba(255,210,100,0.4)); animation-delay:2.2s,2.2s; animation-duration:2.5s,11s; }
        .lotus:nth-child(9) { top:65%;  left:12%;  width:50px;  filter:drop-shadow(0 0  5px rgba(248,190,150,0.4)); animation-delay:2.5s,2.5s; animation-duration:2.5s,14s; }
        .lotus:nth-child(10){ bottom:40%;right:14%;width:48px;  filter:drop-shadow(0 0  5px rgba(255,200,120,0.4)); animation-delay:2.8s,2.8s; animation-duration:2.5s, 9s; }

        @keyframes flowerReveal {
            0%   { opacity:0; transform:scale(0.6) rotate(-15deg); }
            70%  { opacity:1; transform:scale(1.05) rotate(3deg); }
            100% { opacity:1; transform:scale(1) rotate(0deg); }
        }
        @keyframes flowerFloat {
            0%,100% { transform:translateY(0px)   rotate(0deg); }
            20%     { transform:translateY(-14px)  rotate(4deg); }
            40%     { transform:translateY(-8px)   rotate(-3deg); }
            60%     { transform:translateY(-18px)  rotate(3deg); }
            80%     { transform:translateY(-6px)   rotate(-2deg); }
        }

        /* ── Sparkle dots scattered on page ── */
        .sparkles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .sparkle {
            position: absolute;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,210,80,0.9) 0%, transparent 70%);
            animation: sparklePulse 3s ease-in-out infinite;
        }
        .sparkle:nth-child(1)  { top:8%;   left:8%;   animation-delay:0s;    }
        .sparkle:nth-child(2)  { top:15%;  right:12%; animation-delay:0.7s;  }
        .sparkle:nth-child(3)  { top:30%;  left:5%;   animation-delay:1.4s;  }
        .sparkle:nth-child(4)  { top:55%;  right:7%;  animation-delay:0.3s;  }
        .sparkle:nth-child(5)  { bottom:20%;left:10%; animation-delay:1.1s;  }
        .sparkle:nth-child(6)  { bottom:12%;right:15%;animation-delay:0.9s;  }
        .sparkle:nth-child(7)  { top:72%;  left:30%;  animation-delay:1.8s;  }
        .sparkle:nth-child(8)  { top:25%;  right:28%; animation-delay:0.5s;  }
        .sparkle:nth-child(9)  { bottom:35%;left:40%; animation-delay:2.1s;  }
        .sparkle:nth-child(10) { top:48%;  right:42%; animation-delay:1.6s;  }

        @keyframes sparklePulse {
            0%,100% { opacity:0;   transform:scale(0.5); }
            50%     { opacity:0.8; transform:scale(1.5); }
        }

        /* ── Page wrap ── */
        .page-wrap {
            width: 100%;
            max-width: 500px;
            height: 100%;
            padding: 14px 20px 10px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        /* ── Header — stays frozen, never scrolls ── */
        .page-header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 16px;
        }

        /* decorative ring around image */
        .om-ring {
            display: inline-block;
            position: relative;
            margin-bottom: 14px;
        }
        .om-ring::before, .om-ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1.5px solid rgba(212,134,10,0.35);
            animation: ringPulse 3s ease-in-out infinite;
        }
        .om-ring::after {
            inset: -12px;
            border-color: rgba(212,134,10,0.18);
            animation-delay: 0.5s;
        }
        @keyframes ringPulse {
            0%,100% { transform:scale(1);   opacity:0.6; }
            50%     { transform:scale(1.06); opacity:1;   }
        }

        .om-symbol {
            display: block;
            width: 94px; height: 94px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(212,134,10,0.55);
            animation: omGlow 3s ease-in-out infinite;
        }
        @keyframes omGlow {
            0%,100% {
                box-shadow:
                    0 0 14px rgba(212,134,10,0.45),
                    0 0 30px rgba(255,180,50,0.25),
                    0 0 55px rgba(255,210,90,0.12);
            }
            50% {
                box-shadow:
                    0 0 24px rgba(212,134,10,0.75),
                    0 0 55px rgba(255,180,50,0.45),
                    0 0 90px rgba(255,210,90,0.22);
            }
        }

        .page-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.80rem;
            font-weight: 600;
            color: #7a4e08;
            letter-spacing: 0.05em;
            text-shadow: 0 1px 4px rgba(255,200,80,0.35);
        }
        .page-header p {
            font-size: 0.86rem;
            color: #9a7040;
            margin-top: 5px;
            font-style: italic;
        }
        .lang-badge {
            display: inline-block;
            background: rgba(212,134,10,0.09);
            border: 1px solid rgba(212,134,10,0.28);
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 0.72rem;
            color: #a06a10;
            margin-top: 9px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        /* ── Chat Box — fills all remaining space below the header ── */
        .chat-box {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid rgba(212,134,10,0.16);
            border-radius: 22px;
            overflow: hidden;
            box-shadow:
                0 8px 50px rgba(180,110,20,0.13),
                0 3px 12px rgba(180,110,20,0.08),
                0 0 0 1px rgba(212,134,10,0.05),
                inset 0 1px 0 rgba(255,235,160,0.50);
        }

        /* ── Topbar ── */
        .chat-topbar {
            background: linear-gradient(135deg, #fff9ec 0%, #fff3d4 100%);
            border-bottom: 1px solid rgba(212,134,10,0.14);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .guru-orb {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, #f5a623, #d96e08);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
            box-shadow:
                0 0 18px rgba(212,134,10,0.45),
                0 2px 8px rgba(180,100,10,0.25);
            animation: orbGlow 3s ease-in-out infinite;
        }
        @keyframes orbGlow {
            0%,100% { box-shadow: 0 0 18px rgba(212,134,10,0.40), 0 2px 8px rgba(180,100,10,0.2); }
            50%     { box-shadow: 0 0 30px rgba(212,134,10,0.70), 0 2px 12px rgba(180,100,10,0.3); }
        }
        .guru-info h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.06rem; font-weight: 600;
            color: #4a2f08;
        }
        .guru-info p { font-size: 0.70rem; color: #9a7040; margin-top: 1px; }

        .status-row { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .online-dot {
            width: 8px; height: 8px;
            background: #4ecb7a; border-radius: 50%;
            box-shadow: 0 0 7px rgba(78,203,122,0.65);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        #topLangBadge { font-size: 0.62rem; color: #9a7040; text-transform: uppercase; letter-spacing: 0.08em; }

        /* ── Messages ── */
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            background: linear-gradient(180deg, #fffef9 0%, #ffffff 40%);
        }
        .messages::-webkit-scrollbar { width: 3px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(212,134,10,0.22); border-radius: 2px; }

        .msg { max-width: 88%; animation: msgIn 0.28s ease; }
        @keyframes msgIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
        .msg.bot  { align-self: flex-start; }
        .msg.user { align-self: flex-end; }

        .bubble {
            padding: 13px 16px;
            border-radius: 16px;
            font-size: 0.93rem;
            line-height: 1.74;
        }
        .msg.bot .bubble {
            background: #ffffff;
            border: 1px solid rgba(212,134,10,0.16);
            border-left: 3px solid #d4860a;
            border-bottom-left-radius: 4px;
            color: #2d1f08;
            font-style: italic;
            box-shadow:
                0 2px 14px rgba(180,110,20,0.07),
                0 0 24px rgba(212,134,10,0.04);
        }
        .msg.user .bubble {
            background: linear-gradient(135deg, #fff9ec, #fff4dd);
            border: 1px solid rgba(212,134,10,0.18);
            border-bottom-right-radius: 4px;
            color: #3d2008;
            box-shadow: 0 2px 10px rgba(180,110,20,0.07);
        }

        .voice-btn {
            background: none; border: none; cursor: pointer;
            font-size: 0.74rem; color: #c8a060;
            padding: 3px 6px; margin-top: 4px;
            display: flex; align-items: center; gap: 4px;
            transition: color 0.2s;
        }
        .voice-btn:hover { color: #d4860a; }

        /* ── Book Card ── */
        .book-card {
            align-self: flex-start;
            max-width: 88%;
            background: linear-gradient(135deg, #fffcf2, #fff8e6);
            border: 1px solid rgba(212,134,10,0.24);
            border-radius: 14px;
            padding: 14px 16px;
            animation: msgIn 0.3s ease 0.35s both;
            box-shadow: 0 3px 14px rgba(180,110,20,0.09);
        }
        .book-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #d4860a; margin-bottom: 6px; }
        .book-title { font-family: 'Cormorant Garamond', serif; font-size: 0.97rem; font-weight: 600; color: #4a2f08; margin-bottom: 4px; }
        .book-why   { font-size: 0.78rem; color: #9a7040; font-style: italic; margin-bottom: 10px; line-height: 1.5; }
        .book-link  {
            display: inline-block;
            background: linear-gradient(135deg, #f5a623, #d96e08);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 6px 18px;
            border-radius: 20px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 2px 10px rgba(180,110,20,0.30);
        }
        .book-link:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(180,110,20,0.45); }

        /* ── Typing ── */
        .typing {
            align-self: flex-start;
            display: none;
            gap: 6px; align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid rgba(212,134,10,0.16);
            border-left: 3px solid #d4860a;
            border-radius: 16px; border-bottom-left-radius: 4px;
            box-shadow: 0 2px 10px rgba(180,110,20,0.06);
        }
        .typing.show { display: flex; }
        .dot {
            width: 6px; height: 6px;
            background: #d4860a; border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2){animation-delay:.22s}
        .dot:nth-child(3){animation-delay:.44s}
        @keyframes bounce {
            0%,60%,100%{transform:translateY(0);   opacity:0.3}
            30%         {transform:translateY(-6px);opacity:1}
        }

        /* ── Input ── */
        .input-row {
            border-top: 1px solid rgba(212,134,10,0.10);
            padding: 13px 16px;
            display: flex; gap: 10px; align-items: flex-end;
            background: linear-gradient(0deg, #fffcf6, #fffef9);
        }
        .msg-input {
            flex: 1;
            background: #ffffff;
            border: 1px solid rgba(212,134,10,0.20);
            border-radius: 13px;
            padding: 10px 14px;
            color: #2d1f08;
            font-family: 'Crimson Pro', serif;
            font-size: 0.93rem;
            resize: none; outline: none;
            line-height: 1.52; max-height: 96px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 5px rgba(180,110,20,0.06);
        }
        .msg-input::placeholder { color: #c8a878; }
        .msg-input:focus {
            border-color: rgba(212,134,10,0.50);
            box-shadow: 0 0 0 3px rgba(212,134,10,0.09), 0 1px 5px rgba(180,110,20,0.07);
        }
        .send-btn {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #f5a623, #d96e08);
            border: none; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 3px 14px rgba(200,110,10,0.38);
        }
        .send-btn:hover  { transform:scale(1.08); box-shadow:0 4px 20px rgba(200,110,10,0.55); }
        .send-btn:active { transform:scale(0.94); }
        .send-btn svg { width: 16px; height: 16px; fill: white; }

        /* ── Footer ── */
        .chat-foot {
            padding: 7px 16px 11px;
            text-align: center;
            font-size: 0.67rem; color: #b89060;
            background: linear-gradient(0deg, #fffcf6, #fffef9);
            border-top: 1px solid rgba(212,134,10,0.08);
        }
        .chat-foot a { color: #a06a10; text-decoration: none; }
        .chat-foot a:hover { color: #d4860a; }

        @media(max-width:520px){
            .page-wrap   { padding: 8px 10px 6px; }
            .page-header { margin-bottom: 10px; }
            .om-symbol   { width: 72px; height: 72px; }
            .page-header h1 { font-size: 1.45rem; }
            .lotus:nth-child(7),
            .lotus:nth-child(8),
            .lotus:nth-child(9),
            .lotus:nth-child(10) { display: none; }
        }
    </style>
</head>
<body>

    </div>
    <!-- Saffron lotus -->
    <div class="lotus">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="50" cy="24" rx="10" ry="24" fill="#ffab60" opacity="0.88" transform="rotate(0,50,50)"/>

            <circle cx="50" cy="50" r="7"  fill="#ffa000" opacity="0.90"/>

    </div>
    <!-- Rose lotus -->
    <div class="lotus">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="50" cy="23" rx="10" ry="23" fill="#f48fb1" opacity="0.85" transform="rotate(0,50,50)"/>

<div class="page-wrap">

    <div class="page-header">
        <div class="om-ring">
            <img class="om-symbol" src="/static/radha_govind.jpg" alt="Radha Govind — ISKCON Ahmedabad">
        </div>
        <h1>Spiritual Guide</h1>
        <p>ISKCON Ahmedabad &nbsp;|&nbsp; Bhagavat Gita &amp; Shrimad Bhagavatam Wisdom</p>
        <div class="lang-badge" id="langBadge">Detecting language...</div>
    </div>

    <div class="chat-box">
        <div class="chat-topbar">
            <div class="guru-orb">🙏</div>
            <div class="guru-info">
                <h3>Vaishnava Guide</h3>
                <p>English · हिंदी · ગુજરાતી · Hinglish</p>
            </div>
            <div class="status-row">
                <div class="online-dot"></div>
                <span id="topLangBadge">—</span>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="typing" id="typing">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <div class="input-row">
            <textarea class="msg-input" id="msgInput"
                placeholder="What is in your heart today... / आज मन में क्या है... / આજે મનમાં શું છે..."
                rows="1"></textarea>
            <button class="send-btn" onclick="send()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>

        <div class="chat-foot">
            <a href="https://iskconbooks.in" target="_blank">iskconbooks.in</a>
            &nbsp;·&nbsp; Hare Krishna 🙏
        </div>
    </div>
</div>

<script>
    let sessionId   = null;
    let waiting     = false;
    let currentLang = 'english';

    const LANG_CODES = {
        english:  'en-IN',
        hindi:    'hi-IN',
        gujarati: 'gu-IN',
        hinglish: 'hi-IN',
    };

    const LANG_LABELS = {
        english:   '🇬🇧 English',
        hindi:     '🇮🇳 हिंदी',
        gujarati:  '🇮🇳 ગુજરાતી',
        hinglish:  '🇮🇳 Hinglish',
        bengali:   '🇮🇳 বাংলা',
    };

    const input = document.getElementById('msgInput');
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 96) + 'px';
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    async function init() {
        try {
            const r    = await fetch('/api/bot/greet');
            const data = await r.json();
            sessionId  = data.session_id;
            updateLangBadge(data.language);
            addBotMsg(data.message, null, false);
        } catch {
            sessionId = 'local-' + Date.now();
            addBotMsg('Hare Krishna 🙏\n\nDear soul, what is in your heart today?', null, false);
            updateLangBadge('english');
        }
    }

    async function send() {
        const msg = input.value.trim();
        if (!msg || waiting) return;

        addUserMsg(msg);
        input.value = '';
        input.style.height = 'auto';
        waiting = true;
        showTyping(true);

        try {
            const r    = await fetch('/api/bot/chat', {
                method:  'POST',
                headers: {'Content-Type':'application/json'},
                body:    JSON.stringify({ message: msg, session_id: sessionId })
            });
            const data = await r.json();
            showTyping(false);
            updateLangBadge(data.language);
            addBotMsg(data.reply, data.book, true);
        } catch {
            showTyping(false);
            addBotMsg('Dear one, please try again in a moment 🙏', null, false);
        }
        waiting = false;
    }

    window._msgStore  = {};
    window._langStore = {};

    function addBotMsg(text, book, withVoice) {
        const area   = document.getElementById('messages');
        const typing = document.getElementById('typing');
        const div    = document.createElement('div');
        div.className = 'msg bot';

        const msgId = 'msg_' + Date.now();
        window._msgStore[msgId]  = text;
        window._langStore[msgId] = currentLang;

        div.innerHTML = `
            <div class="bubble">${text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>
            ${withVoice ? `<button class="voice-btn" data-msgid="${msgId}" onclick="speak(this)">🔊 Listen</button>` : ''}
        `;
        area.insertBefore(div, typing);

        if (book) {
            setTimeout(() => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-label">📖 Srila Prabhupada suggests</div>
                    <div class="book-title">${book.title}</div>
                    <div class="book-why">${book.why}</div>
                    <a class="book-link" href="${book.url}" target="_blank">Read this book →</a>
                `;
                area.insertBefore(card, typing);
                scrollDown();
            }, 700);
        }
        scrollDown();
    }

    function addUserMsg(text) {
        const area   = document.getElementById('messages');
        const typing = document.getElementById('typing');
        const div    = document.createElement('div');
        div.className = 'msg user';
        div.innerHTML = `<div class="bubble">${text}</div>`;
        area.insertBefore(div, typing);
        scrollDown();
    }

    function showTyping(show) {
        document.getElementById('typing').classList.toggle('show', show);
        if (show) scrollDown();
    }

    function updateLangBadge(lang) {
        if (!lang) return;
        currentLang = lang;
        const label = LANG_LABELS[lang] || lang;
        document.getElementById('langBadge').textContent    = label;
        document.getElementById('topLangBadge').textContent = label;
    }

    function speak(btn) {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            btn.innerHTML = '🔊 Listen';
            return;
        }
        const msgId    = btn.getAttribute('data-msgid');
        const text     = window._msgStore[msgId]  || '';
        const lang     = window._langStore[msgId] || 'english';
        const langCode = LANG_CODES[lang] || 'en-IN';
        const voices   = speechSynthesis.getVoices();
        let voice = voices.find(v => v.lang === langCode)
                 || voices.find(v => v.lang.startsWith(langCode.split('-')[0]))
                 || null;
        const u   = new SpeechSynthesisUtterance(text);
        u.lang    = langCode;
        u.rate    = 0.82;
        u.pitch   = 0.9;
        if (voice) u.voice = voice;
        u.onstart = () => btn.innerHTML = '⏹ Stop';
        u.onend   = () => btn.innerHTML = '🔊 Listen';
        window.speechSynthesis.speak(u);
    }

    function scrollDown() {
        const area = document.getElementById('messages');
        setTimeout(() => area.scrollTop = area.scrollHeight, 60);
    }

    init();
</script>
